<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />

  <title>%PORTFOLIO_NAME% | %PORTFOLIO_TITLE%</title>
  <meta name="description" content="%PORTFOLIO_DESCRIPTION%" />
  <meta name="author" content="%PORTFOLIO_NAME%" />
  <link rel="canonical" href="%PORTFOLIO_URL%" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="%PORTFOLIO_URL%" />
  <meta property="og:title" content="%PORTFOLIO_NAME% | %PORTFOLIO_TITLE%" />
  <meta property="og:description" content="%PORTFOLIO_DESCRIPTION%" />
  <meta property="og:image" content="%PORTFOLIO_IMAGE%" />
  <meta property="og:image:alt" content="Portrait of %PORTFOLIO_NAME%" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="%PORTFOLIO_NAME% | %PORTFOLIO_TITLE%" />
  <meta name="twitter:description" content="%PORTFOLIO_DESCRIPTION%" />
  <meta name="twitter:image" content="%PORTFOLIO_IMAGE%" />

  <link rel="apple-touch-icon" href="/logo192.png" />
  <link rel="manifest" href="/manifest.json" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" />

  <script>
    // Decode the SPA-fallback redirect from 404.html so BrowserRouter sees the real path.
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    }(window.location));
  </script>

  <script type="application/ld+json">%PORTFOLIO_JSONLD%</script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
